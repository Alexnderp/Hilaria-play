<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/app.css" />

    <title>Hilaria Play</title>
  </head>
  <body>
    <header>
      <header class="nav">
        <a href="../index.html"> <img class="logo" src="../utils/img/image.png" alt="" /></a>
        <nav class="menu">
          <ul>
            <a href="login.html"><li>Login</li></a>
          </ul>
        </nav>
      </header>
    </header>
    <main>
      <div class="login-conteiner">
        <img class="banner" src="https://i.ibb.co/fGKc3F0B/Copilot-20251015-185502.png" alt="">
        <form class="login" action="submit">
          <div class="title">
            <h2>Login:</h2>
            <span>Compartilhe suas risadas conosco!</span>
          </div>
          <div class="field">
            <label for="email">Email: </label>
            <input class="input" type="email" name="email" id="" />
          </div>
          <div class="field">
            <label for="password">Senha: </label>
            <input class="input" type="password" name="password" id="" />
          </div>
          <div class="forget-new">
            <span><a href="#">Cadastre-se</a></span>
            <span><a href="#">Esqueci minha senha</a></span>
          </div>
          <button class="login-btn" type="submit" >Login</button>
        </form>
      </div>
    </main>
    <footer class="footer">
      <span
        >Desenvolvido por:
        <a class="github" href="https://github.com/alexnderp" target="_blank"
          >Alexander Pereira</a
        >
      </span>
      <span>&#169; 2025 - Todos os direitos reservados</span>
    </footer>
  </body>
</html>
